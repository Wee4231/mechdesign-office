<title>Mini Design Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: a 3D room you can turn, status chips above, a detail panel for the clicked person, then cards and an activity log. */
:root {
  --bg: #eef1f6; --panel: #ffffff; --fg: #1c2433; --muted: #5f6b80; --line: #d8dee9; --accent: #2f6fed;
  --working: #2f6fed; --waiting: #d98a00; --done: #1f9d63; --idle: #8a94a3; --blocked: #d6453d;
  --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161f; --panel: #1b2130; --fg: #e8ecf5; --muted: #9aa5ba; --line: #2c3548; --accent: #6c9bff;
    --working: #6c9bff; --waiting: #f0a826; --done: #3fc283; --idle: #7d889b; --blocked: #ef6b63; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161f; --panel: #1b2130; --fg: #e8ecf5; --muted: #9aa5ba; --line: #2c3548; --accent: #6c9bff;
  --working: #6c9bff; --waiting: #f0a826; --done: #3fc283; --idle: #7d889b; --blocked: #ef6b63; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); }
* { box-sizing: border-box; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 28px; text-wrap: balance; }
h2 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 500; font-size: 18px; }
.sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--idle); flex: none; }
.dot.working { background: var(--working); } .dot.waiting { background: var(--waiting); } .dot.done { background: var(--done); } .dot.blocked { background: var(--blocked); }
.note { font-size: 13px; color: var(--muted); min-height: 18px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 14px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; touch-action: none; }
.stage canvas { display: block; width: 100%; cursor: grab; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tagbox { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 11px; padding: 4px 9px 6px; font: 700 11.5px/1.2 var(--font-body); text-align: left; min-width: 96px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); will-change: transform; }
.tagbox:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tagbox.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.tagbox .r1 { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tagbox { min-width: 0; padding: 3px 9px; }
.tagbox.sel { padding-bottom: 6px; }
.tagbox .sb, .tagbox .tb { display: none; }
.tagbox.sel .sb { display: block; color: var(--muted); font-weight: 600; font-size: 10.5px; white-space: nowrap; margin-top: 1px; }
.tagbox.sel .tb { display: block; height: 3px; border-radius: 2px; background: var(--line); margin-top: 4px; overflow: hidden; }
.tagbox .tb i { display: block; height: 100%; width: 0; background: var(--idle); }
.hint { position: absolute; left: 10px; bottom: 8px; font-size: 11.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; pointer-events: none; }
.tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.tools button { font: 700 12px var(--font-body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.tools button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.tl { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.tlr { display: grid; grid-template-columns: 130px minmax(0, 1fr); align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
.tlt { position: relative; height: 18px; border-radius: 9px; background: var(--bg); }
.tlb { position: absolute; top: 7px; height: 4px; border-radius: 2px; opacity: 0.35; }
.tld { position: absolute; top: 3px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--panel); padding: 0; cursor: pointer; transform: translateX(-50%); }
.tln { font-size: 12px; color: var(--muted); font-weight: 400; }
@media (max-width: 520px) { .tlr { grid-template-columns: 90px minmax(0, 1fr); } }
.detail { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 9px; min-width: 0; }
.detail .nm { font-family: var(--font-display); font-weight: 600; font-size: 20px; }
.detail .ph { color: var(--muted); font-size: 13px; }
.detail .lab { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.detail .val { font-size: 14.5px; overflow-wrap: anywhere; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; color: #fff; background: var(--idle); white-space: nowrap; justify-self: start; }
.tag.working { background: var(--working); } .tag.waiting { background: var(--waiting); color: #1c1608; } .tag.done { background: var(--done); } .tag.blocked { background: var(--blocked); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--idle); border-radius: 3px; transition: width 0.5s; }
.bar.working > i { background: var(--working); } .bar.waiting > i { background: var(--waiting); } .bar.done > i { background: var(--done); } .bar.blocked > i { background: var(--blocked); }
.when { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .name { font-weight: 700; font-size: 15px; }
.card .phase { color: var(--muted); font-size: 12px; }
.task { font-size: 14px; overflow-wrap: anywhere; } .task.empty { color: var(--muted); }
.log { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.log li { display: flex; gap: 10px; font-size: 14px; align-items: baseline; }
.log li b { flex: none; min-width: 120px; font-size: 13px; }
.log li span { min-width: 0; overflow-wrap: anywhere; }
.log .empty { color: var(--muted); font-size: 14px; }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Mini Design Office</h1>
      <div class="sub" id="project">Mechanical design team</div>
    </div>
    <div class="counts" id="counts"></div>
  </header>
  <div class="note" id="note">Connecting to live status…</div>
  <div class="main">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="labels" id="labels"></div>
      <div class="tools">
        <button type="button" id="bNight" title="Switch between day and night">Day</button>
        <button type="button" id="bFollow" aria-pressed="false" title="Camera follows the selected person">Follow</button>
        <button type="button" id="bWalk" aria-pressed="false" title="Walk around the room yourself">Walk in</button>
      </div>
      <div class="hint" id="hint">Drag to turn · scroll to zoom · click a person</div>
    </div>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </div>
  <section>
    <h2>Team</h2>
    <div class="cards" id="cards"></div>
  </section>
  <section>
    <h2>Timeline</h2>
    <div class="tl" id="timeline"></div>
  </section>
  <section class="log">
    <h2>Activity</h2>
    <ol id="log"></ol>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
const LABEL = { idle: "Idle", working: "Working", waiting: "Needs you", done: "Done", blocked: "Blocked" };
const ACT = { type: "Working at the desk", wait: "Waiting for you", blocked: "Stuck, needs help", sit: "At the desk, resting", nap: "Taking a nap", coffee: "Having a coffee", "walk-water": "Walking to the water cooler", drink: "Drinking water", "walk-back": "Going back to the desk" };
// desk = desk centre on the floor (x right, z toward the viewer). The person sits behind it, facing +z.
const TEAM = [
  { id: "sizing-engineer", name: "Sizing Engineer", phase: "Phase 1 · forces and sizes", desk: [-4.5, -3.6], shirt: 0xe07a3f, hair: 0x5a3a22 },
  { id: "bom-specialist", name: "BOM Specialist", phase: "Phase 2 · standard parts", desk: [-1.5, -3.6], shirt: 0x8b5fd1, hair: 0x1f1f1f },
  { id: "cad-downloader", name: "CAD Collector", phase: "Phase 2.5 · CAD files", desk: [1.5, -3.6], shirt: 0x17a2a2, hair: 0x8a5a2b },
  { id: "cad-modeler", name: "CAD Modeler", phase: "Phase 3 · custom parts", desk: [-4.5, -0.6], shirt: 0xd6457a, hair: 0x2b1a12 },
  { id: "assembly-inspector", name: "Assembly Inspector", phase: "Phase 4 · assembly check", desk: [-1.5, -0.6], shirt: 0x3f9b52, hair: 0xc98a3a },
  { id: "director", name: "Director", phase: "Engineering lead · talks to you", desk: [1.5, 2.0], shirt: 0x34415f, hair: 0x262630, boss: true }
];
const data = { agents: {}, log: [], logAll: [], office: {} };
let selected = "director";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const status = id => (data.agents[id] && LABEL[data.agents[id].status]) ? data.agents[id].status : "idle";
const pct = id => Math.max(0, Math.min(100, Math.round(Number(data.agents[id]?.progress) || 0)));
const NOMOVE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rand = (a, b) => a + Math.random() * (b - a);

function ago(ms) {
  if (!ms) return "no update yet";
  const m = Math.round((Date.now() - ms) / 60000);
  return m < 1 ? "updated just now" : m < 60 ? `updated ${m} min ago` : m < 1440 ? `updated ${Math.round(m / 60)} h ago` : `updated ${Math.round(m / 1440)} d ago`;
}
function nowText(a) {
  const st = status(a.id), d = data.agents[a.id] || {};
  if (st === "working") return `Working on: ${d.task || "their task"}`;
  if (st === "waiting") return `Waiting for you: ${d.task || "a decision"}`;
  if (st === "blocked") return `Blocked: ${d.task || "needs help"}`;
  return (ACT[a.act] || ACT.sit) + (st === "done" ? " (finished their jobs)" : "");
}
function labelSub(a) {
  const st = status(a.id);
  if (st === "working") return `Working · ${pct(a.id)}%`;
  if (st === "waiting") return "Needs you";
  if (st === "blocked") return "Blocked";
  return ACT[a.act] || ACT.sit;
}

/* ---------- 3D ---------- */
const stage = document.getElementById("stage"), cv = document.getElementById("cv"), labelsEl = document.getElementById("labels");
const agents = TEAM.map(d => Object.assign({ mode: "seated", act: "sit", goal: "", path: [], nextAt: rand(1, 8), until: 0, pose: {}, heading: 0 }, d));
let R = null;

function build() {
  const T = window.THREE;
  const renderer = new T.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
  const scene = new T.Scene();
  const cam = new T.PerspectiveCamera(32, 1.6, 0.1, 100);
  const hemi = new T.HemisphereLight(0xffffff, 0x8a8f9c, 0.95); scene.add(hemi);
  const sun = new T.DirectionalLight(0xffffff, 0.85); sun.position.set(7, 12, 8); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 40 }); scene.add(sun);
  const M = (c, o = {}) => new T.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85, metalness: 0.05 }, o));
  const mesh = (g, m, x = 0, y = 0, z = 0, cast = true) => { const o = new T.Mesh(g, m); o.position.set(x, y, z); o.castShadow = cast; o.receiveShadow = true; return o; };
  const Box = (w, h, d) => new T.BoxGeometry(w, h, d);

  // room
  const floorCv = document.createElement("canvas"); floorCv.width = floorCv.height = 128;
  const floorTex = new T.CanvasTexture(floorCv); floorTex.wrapS = floorTex.wrapT = T.RepeatWrapping; floorTex.repeat.set(7, 5.5); floorTex.magFilter = T.NearestFilter;
  const floorMat = M(0xffffff, { map: floorTex });
  const wallL = M(0xcdd6e5), wallB = M(0xdbe2ee);
  scene.add(mesh(Box(14.4, 0.3, 11.4), floorMat, 0, -0.15, 0, false));
  scene.add(mesh(Box(0.2, 4, 11.4), wallL, -7.1, 1.85, 0, false));
  scene.add(mesh(Box(14.4, 4, 0.2), wallB, 0, 1.85, -5.6, false));
  const glass = M(0xbfe0f2, { emissive: 0x6fb4d8, emissiveIntensity: 0.35, roughness: 0.2 });
  for (const z of [-3.4, -0.2, 3]) scene.add(mesh(Box(0.06, 1.5, 2), glass, -6.98, 2.2, z, false));
  for (const x of [-4.5, -1, 5.6]) scene.add(mesh(Box(2, 1.5, 0.06), glass, x, 2.2, -5.48, false));

  // wall board (project + progress)
  const boardCv = document.createElement("canvas"); boardCv.width = 512; boardCv.height = 256;
  const boardTex = new T.CanvasTexture(boardCv);
  const board = mesh(Box(3.2, 1.6, 0.06), [M(0xdddddd), M(0xdddddd), M(0xdddddd), M(0xdddddd), M(0xffffff, { map: boardTex }), M(0xdddddd)], 3.6, 2.5, -5.45, false);
  scene.add(board);

  // water cooler
  const cooler = new T.Group();
  cooler.add(mesh(Box(0.55, 0.95, 0.5), M(0xf2f4f8), 0, 0.475, 0));
  cooler.add(mesh(new T.CylinderGeometry(0.2, 0.2, 0.55, 20), M(0x6fb8ee, { transparent: true, opacity: 0.7 }), 0, 1.22, 0));
  cooler.add(mesh(Box(0.1, 0.06, 0.08), M(0x3b4a66), 0, 0.75, 0.28));
  cooler.position.set(6, 0, -5.0); scene.add(cooler);

  // plants
  for (const [x, z] of [[6, 1.6], [-6.2, 4.4], [6.2, 4.6]]) {
    const p = new T.Group();
    p.add(mesh(new T.CylinderGeometry(0.3, 0.24, 0.45, 16), M(0xb7673f), 0, 0.225, 0));
    for (const [dx, dy, dz, r] of [[0, 0.95, 0, 0.42], [-0.22, 0.7, 0.1, 0.3], [0.24, 0.72, -0.08, 0.3]]) p.add(mesh(new T.SphereGeometry(r, 14, 12), M(0x4fa36a), dx, dy, dz));
    p.position.set(x, 0, z); scene.add(p);
  }

  // desks, chairs, monitors
  const wood = 0xd9c7a8, metal = 0x8a8f99, lamps = [];
  for (const a of agents) {
    const [dx, dz] = a.desk, w = a.boss ? 2.6 : 2.0, d = 1.0;
    a.seat = { x: dx, z: dz - 0.75 }; a.gapX = dx + (a.boss ? 1.9 : 1.5); a.aisleZ = -2.4;
    const g = new T.Group(); g.position.set(dx, 0, dz);
    g.add(mesh(Box(w, 0.07, d), M(a.boss ? 0x3a4763 : wood), 0, 0.75, 0));
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) g.add(mesh(Box(0.06, 0.72, 0.06), M(metal), sx * (w / 2 - 0.08), 0.36, sz * (d / 2 - 0.08)));
    g.add(mesh(Box(0.5, 0.03, 0.18), M(0x232833), -0.35, 0.805, -0.2));
    const mon = new T.Group(); mon.position.set(w / 2 - 0.6, 0.79, 0.1);
    mon.add(mesh(Box(0.1, 0.25, 0.08), M(0x222733), 0, 0.12, 0));
    mon.add(mesh(Box(0.9, 0.55, 0.05), M(0x151a24), 0, 0.5, 0));
    a.scrFront = new T.Mesh(new T.PlaneGeometry(0.8, 0.46), new T.MeshStandardMaterial({ color: 0x0b0f17, emissive: 0x3b6fe0, emissiveIntensity: 0.4 })); a.scrFront.position.set(0, 0.5, -0.03); a.scrFront.rotation.y = Math.PI;
    a.scrBack = new T.Mesh(new T.PlaneGeometry(0.8, 0.46), new T.MeshStandardMaterial({ color: 0x222733, emissive: 0x8a94a3, emissiveIntensity: 0.7 })); a.scrBack.position.set(0, 0.5, 0.03);
    mon.add(a.scrFront, a.scrBack); g.add(mon);
    if (a.boss) g.add(mesh(Box(0.5, 0.1, 0.12), M(0x6c9bff), 0.6, 0.84, -0.3));
    scene.add(g);
    const lamp = new T.PointLight(0xffd9a0, 0, 5); lamp.position.set(dx, 1.7, dz - 0.3); scene.add(lamp); lamps.push(lamp); // lit at night only
    const ch = new T.Group(); ch.position.set(a.seat.x, 0, a.seat.z - 0.12);
    ch.add(mesh(Box(0.56, 0.08, 0.56), M(0x4a5468), 0, 0.45, 0.1));
    ch.add(mesh(Box(0.56, 0.62, 0.08), M(0x4a5468), 0, 0.82, -0.2));
    ch.add(mesh(new T.CylinderGeometry(0.04, 0.04, 0.4, 8), M(0x2a2f3b), 0, 0.22, 0.1));
    ch.add(mesh(new T.CylinderGeometry(0.3, 0.3, 0.04, 16), M(0x2a2f3b), 0, 0.03, 0.1));
    scene.add(ch);
  }

  // people
  const skin = M(0xf3c9a5, { roughness: 0.7 }), dark = M(0x1c2230), pants = M(0x2c3447);
  const zTex = c => { const k = document.createElement("canvas"); k.width = k.height = 64; const x = k.getContext("2d"); x.fillStyle = c; x.font = "bold 46px sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("Z", 32, 34); return new T.CanvasTexture(k); };
  const zMap = zTex("#5b7fe0");
  for (const a of agents) {
    const root = new T.Group(); root.position.set(a.seat.x, 0, a.seat.z); root.userData.id = a.id; scene.add(root); a.root = root;
    const body = new T.Group(); body.scale.setScalar(0.85); root.add(body);
    const hips = new T.Group(); hips.position.y = 0.62; body.add(hips); a.hips = hips;
    const shirt = M(a.shirt);
    a.legL = new T.Group(); a.legL.position.set(-0.11, 0, 0); a.legR = new T.Group(); a.legR.position.set(0.11, 0, 0);
    for (const l of [a.legL, a.legR]) { l.add(mesh(new T.CapsuleGeometry(0.09, 0.34, 4, 8), pants, 0, -0.28, 0)); l.add(mesh(new T.SphereGeometry(0.1, 10, 8), dark, 0, -0.5, 0.05)); hips.add(l); }
    const torso = new T.Group(); hips.add(torso); a.torso = torso;
    torso.add(mesh(new T.CapsuleGeometry(0.21, 0.3, 4, 12), shirt, 0, 0.34, 0));
    if (a.boss) torso.add(mesh(Box(0.07, 0.3, 0.02), M(0x6c9bff), 0, 0.36, 0.215));
    const head = new T.Group(); head.position.set(0, 0.84, 0); torso.add(head); a.head = head;
    head.add(mesh(new T.SphereGeometry(0.3, 20, 16), skin, 0, 0.3, 0));
    const hair = mesh(new T.SphereGeometry(0.325, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), M(a.hair), 0, 0.31, -0.02); hair.rotation.x = -0.4; head.add(hair);
    a.eyes = [-0.11, 0.11].map(x => { const e = mesh(new T.SphereGeometry(0.045, 8, 8), dark, x, 0.33, 0.27, false); head.add(e); return e; });
    a.mouth = mesh(Box(0.1, 0.025, 0.02), M(0x8a3b2a), 0, 0.2, 0.285, false); head.add(a.mouth);
    for (const sx of [-1, 1]) head.add(mesh(new T.SphereGeometry(0.04, 8, 6), M(0xf0a79a), sx * 0.18, 0.24, 0.24, false));
    a.armL = new T.Group(); a.armL.position.set(-0.29, 0.58, 0); a.armR = new T.Group(); a.armR.position.set(0.29, 0.58, 0);
    for (const arm of [a.armL, a.armR]) { arm.add(mesh(new T.CapsuleGeometry(0.07, 0.3, 4, 8), shirt, 0, -0.2, 0)); arm.add(mesh(new T.SphereGeometry(0.08, 10, 8), skin, 0, -0.4, 0)); torso.add(arm); }
    a.cup = mesh(new T.CylinderGeometry(0.055, 0.045, 0.12, 12), M(0xffffff), 0, -0.45, 0.08); a.cup.visible = false; a.armR.add(a.cup);

(async () => {
  const note = document.getElementById("note");
  const db = await window.claude?.use("db").catch(() => null);

  const timer = setTimeout(() => { note.textContent = "Live status can't be reached yet, so this may be out of date."; }, 10000);

  const fail = () => { clearTimeout(timer); note.textContent = "Live status could not be loaded."; };
